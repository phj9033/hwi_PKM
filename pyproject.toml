[project]
name = "hwi-pkm"
version = "0.1.0-dev"
description = "Personal Knowledge Management system — solo PKM with Claude Code as primary AI agent."
requires-python = ">=3.11"
authors = [{ name = "hwijung-park" }]
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
    "python-frontmatter>=1.1",  # used in later milestones; harmless now
    "psutil>=5.9",
]

[project.optional-dependencies]
# Heavy deps — pinned now so future milestones can `uv sync` consistently
ml = [
    "sentence-transformers>=2.7",
    "sqlite-vec>=0.1",
]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "pytest-forked>=1.6",
    "pytest-xdist>=3.6",
    "ruff>=0.5",
    "pyright>=1.1",
]

[project.scripts]
pkm = "pkm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pkm"]

[tool.pytest.ini_options]
markers = [
    "slow: requires real models, run sequentially",
]
addopts = "--timeout=300 --maxfail=5"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.pyright]
pythonVersion = "3.11"
include = ["pkm", "tests"]
typeCheckingMode = "basic"
