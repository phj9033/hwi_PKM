[project]
name = "hwi-pkm"
version = "0.1.0-dev"
description = "Personal Knowledge Management system — solo PKM with Claude Code as primary AI agent."
requires-python = ">=3.11"
authors = [{ name = "hwijung-park" }]
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
    "python-frontmatter>=1.1",  # used in later milestones; harmless now
    "psutil>=5.9",
    "jinja2>=3.1",
    "markdown>=3.6",
    # numpy is used by StubEmbedder (always loaded via pkm.commands.* registration
    # chain through pkm._mutations → pkm.store.embedder), so it must be a core
    # runtime dep. ml-only optional install used to fail at command registration.
    "numpy>=1.26",
    # sqlite-vec is loaded inside pkm.store.index_db.connect(), which every
    # search/index/lint command path reaches. Same "optional-but-always-imported"
    # trap that bit numpy — keep it core.
    # Pre-v1: minor bumps may break (per its SemVer policy); pinned to 0.1.x.
    "sqlite-vec>=0.1,<0.2",
]

[project.optional-dependencies]
# Heavy deps — pinned now so future milestones can `uv sync` consistently
ml = [
    "sentence-transformers>=2.7",
    "huggingface_hub>=0.23",
]
extract = [
    "pdfplumber>=0.11",
    "markdownify>=0.13",
]
korean = [
    # Lang-aware Korean morphological tokenizer used by M12 m002 migration.
    # Without this extra, `pkm migrate` cleanly skips m002 — schema stays at v1.
    "kiwipiepy>=0.17",
]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "ruff>=0.5",
    "pyright>=1.1",
]

[project.scripts]
pkm = "pkm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pkm"]

[tool.pytest.ini_options]
markers = [
    "slow: requires real models, run sequentially",
]
addopts = "--timeout=300 --maxfail=5"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501", "B008"]  # E501: line length handled by formatter; B008: typer.Option() in defaults is idiomatic

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["pkm", "tests"]
typeCheckingMode = "basic"
